name: Refresh v3.1.1 rank title (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-v3.1.1.yml']

permissions:
  contents: read

concurrency:
  group: miye-publish-v3.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'KINO-L/PagePath' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c8051fe1e2e5c6c0a097553123984b5f0df88850
          persist-credentials: false
      - name: Verify fixed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne 'c8051fe1e2e5c6c0a097553123984b5f0df88850') { throw 'Unexpected source commit' }
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '3.1.1') { throw 'Unexpected version' }
      - name: Test
        run: npm test
      - name: Build and verify package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/package.ps1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'dist/Miye-v3.1.1.zip'))
          try {
            if ($zip.Entries.Count -ne 48) { throw 'Unexpected package file count' }
            $names = [string[]]@($zip.Entries.FullName)
            [Array]::Sort($names, [StringComparer]::Ordinal)
            $rows = foreach ($name in $names) {
              $entry = $zip.GetEntry($name)
              $stream = $entry.Open()
              try { $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)).ToLowerInvariant() }
              finally { $stream.Dispose() }
              $name + '|' + $entry.Length + '|' + $digest
            }
            $canonical = ($rows -join "`n") + "`n"
            $contentHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($canonical))).ToLowerInvariant()
            if ($contentHash -ne '7375a4f4051c73dbc31b059fd2fd5114ebdd56719f12b25fb06b007eed21743a') { throw 'Package does not match the verified Edge submission contents' }
            Write-Output "Verified package contents: $contentHash"
          } finally { $zip.Dispose() }
      - name: Update existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'KINO-L/PagePath'
          $release = gh api "repos/$repo/releases/tags/v3.1.1" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.id -ne 413831365 -or $release.draft) { throw 'Unexpected release' }
          $tag = gh api "repos/$repo/git/ref/tags/v3.1.1" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $tag.object.sha -ne 'd9f23e35886b7855d274bffa0377c76ebdd93670') { throw 'Original version tag changed' }
          if (@($release.assets | Where-Object name -eq 'Miye-v3.1.1.zip').Count -ne 1) { throw 'Unexpected existing installer' }
          $notes = @'
          迷页 / PageWander / 迷いページ，把网页变成迷宫，带着小火苗寻找出口。
          
          - 名称自动跟随浏览器界面语言：中文「迷页」、英文「PageWander」、日文「迷いページ」。
          - 最高等级称号统一调整为「神仙」，英文为 Immortal，日文为「仙人」。
          - 同步扩展管理页、工具栏、游戏无障碍标签与受限页面提示中的名称。
          - 提供中英日隐私说明；现有迷宫玩法、权限、升级经验与本地存档保持兼容。
          
          **安装**：下载 `Miye-v3.1.1.zip` 并解压，在 Chrome / Edge 扩展管理页开启开发者模式，选择「加载已解压的扩展程序」。需要浏览器 109 及以上版本。
          
          **升级**：覆盖原安装目录，重新加载扩展并刷新网页；保留原扩展安装以继续使用本地经验。
          
          [使用指南](https://github.com/KINO-L/PagePath/blob/c8051fe1e2e5c6c0a097553123984b5f0df88850/docs/USAGE.md) · [隐私说明](https://github.com/KINO-L/PagePath/blob/c8051fe1e2e5c6c0a097553123984b5f0df88850/docs/PRIVACY.md) · [本次安装包源码](https://github.com/KINO-L/PagePath/tree/c8051fe1e2e5c6c0a097553123984b5f0df88850)
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'miye-v3.1.1-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          gh release upload v3.1.1 dist/Miye-v3.1.1.zip --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed' }
          gh release edit v3.1.1 --repo $repo --title '迷页 v3.1.1' --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
          $expected = (Get-FileHash dist/Miye-v3.1.1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $updated = gh api "repos/$repo/releases/tags/v3.1.1" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed' }
          $assets = @($updated.assets | Where-Object name -eq 'Miye-v3.1.1.zip')
          if ($assets.Count -ne 1 -or $assets[0].digest -ne "sha256:$expected" -or $assets[0].state -ne 'uploaded') { throw 'Uploaded installer checksum mismatch' }
          Write-Output "Release URL: $($updated.html_url)"
          Write-Output "Installer SHA256: $expected"
