name: Publish v3.1.1 (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v3.1.1.yml']

permissions:
  contents: read

concurrency:
  group: miye-publish-v3.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'KINO-L/PagePath' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d9f23e35886b7855d274bffa0377c76ebdd93670
          persist-credentials: false
      - name: Verify release source
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '3.1.1' -or $package.version -ne '3.1.1') { throw 'Unexpected release version.' }
          if ((git rev-parse HEAD) -ne 'd9f23e35886b7855d274bffa0377c76ebdd93670') { throw 'Unexpected release source.' }
      - name: Test
        run: npm test
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'v3.1.1'
          $commit = 'd9f23e35886b7855d274bffa0377c76ebdd93670'
          $archive = Join-Path $PWD 'dist/Miye-v3.1.1.zip'
          $notes = @'
          迷页 / PageWander / 迷いページ，把网页变成迷宫，带着小火苗寻找出口。
          
          - 名称自动跟随浏览器界面语言：中文「迷页」、英文「PageWander」、日文「迷いページ」。
          - 同步扩展管理页、工具栏、游戏无障碍标签与受限页面提示中的名称。
          - 补充英文与日文隐私说明；现有迷宫玩法、权限、经验与存档格式保持兼容。
          - 提供 Edge 上架素材包，含图标、宣传图、中英日文截图、介绍与权限说明。
          
          **安装**：下载 `Miye-v3.1.1.zip` 并解压，在 Chrome / Edge 扩展管理页开启开发者模式，选择「加载已解压的扩展程序」。需要浏览器 109 及以上版本。
          
          **升级**：覆盖原安装目录，重新加载扩展并刷新网页；保留原扩展安装以继续使用本地经验。
          
          **上架素材**：`Miye-Edge-v3.1.1-materials.zip` 包含安装包及宣传材料，供 Edge 商城提交使用。
          
          [使用指南](https://github.com/KINO-L/PagePath/blob/v3.1.1/docs/USAGE.md) · [隐私说明](https://github.com/KINO-L/PagePath/blob/v3.1.1/docs/PRIVACY.md)
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'miye-v3.1.1-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $releaseList = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases.' }
          $existing = @($releaseList | Where-Object tag_name -eq $tag)
          if ($existing.Count -gt 1) { throw 'Unexpected duplicate releases.' }
          $refs = gh api "repos/$repo/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify version tag.' }
          $existingRef = @($refs | Where-Object ref -eq "refs/tags/$tag")
          if ($existingRef.Count -gt 0 -and ($existingRef[0].object.type -ne 'commit' -or $existingRef[0].object.sha -ne $commit)) { throw 'Version tag points to a different commit.' }
          if ($existing.Count -eq 0) {
            gh release create $tag $archive --repo $repo --target $commit --title '迷页 v3.1.1' --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          } else {
            $release = $existing[0]
            if ($release.draft -and $release.target_commitish -ne $commit) { throw 'Draft targets a different commit.' }
            if (-not $release.draft -and $existingRef.Count -ne 1) { throw 'Published release tag is missing.' }
            if (-not @($release.assets | Where-Object name -eq 'Miye-v3.1.1.zip').Count) {
              gh release upload $tag $archive --repo $repo
              if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed.' }
            }
            gh release edit $tag --repo $repo --draft=false --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }
          gh release view $tag --repo $repo --json url,tagName,isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
