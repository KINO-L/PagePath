name: Publish v3.0.0 (temporary)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v3.0.0.yml']

permissions:
  contents: read

concurrency:
  group: pagepath-publish-v3.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'KINO-L/PagePath' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4b63a6e192d6e94ff363f526254df2ca8b282ef0
          persist-credentials: false
      - name: Verify release source
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '3.0.0' -or $package.version -ne '3.0.0') { throw 'Unexpected release version.' }
          if ((git rev-parse HEAD) -ne '4b63a6e192d6e94ff363f526254df2ca8b282ef0') { throw 'Unexpected release source.' }
      - name: Test
        run: npm test
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'v3.0.0'
          $commit = '4b63a6e192d6e94ff363f526254df2ca8b282ef0'
          $archive = Join-Path $PWD 'dist/PagePath-v3.0.0.zip'
          $notes = @'
          PagePath v3.0.0 全面升级为网页迷宫。
          
          - 取消页面解锁条件，保留网页障碍，用不规则细线形成迷宫；必要时局部打通通道。
          - 随机生成 1–5 星：简单页面偏向低星，复杂页面偏向高星，各页面均保留所有星级的机会，最终按实际路线核验难度。
          - 单击砚台后自由移动，无需按住鼠标，墨水无限；靠近障碍显示红色碰撞边界。
          - 新增经验泡泡，每张地图必有一个随机倍率泡泡，持续显示柔和呼吸光。
          - 通关经验为「（难度基础经验＋收集经验）×倍率」，用时和失败次数不影响奖励。
          - 新增 1–100 级及八阶段称号，经验和等级自动保存在本地，结算直接显示在悬浮栏。
          
          ### 安装与更新
          
          下载下方 **PagePath-v3.0.0.zip** 并解压，在 Chrome / Edge 的扩展管理页开启开发者模式，选择「加载已解压的扩展程序」，选中包含 `manifest.json` 的目录。
          
          更新时替换原安装目录文件，重新加载扩展并刷新网页。v3 新增用于本地进度的 `storage` 权限；请保留原扩展安装，避免卸载清除等级进度。
          
          [使用指南](https://github.com/KINO-L/PagePath/blob/v3.0.0/docs/USAGE.md) · [更新记录](https://github.com/KINO-L/PagePath/blob/v3.0.0/CHANGELOG.md) · [隐私说明](https://github.com/KINO-L/PagePath/blob/v3.0.0/docs/PRIVACY.md)
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'pagepath-v3.0.0-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $releaseList = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read releases.' }
          $existing = @($releaseList | Where-Object tag_name -eq $tag)
          if ($existing.Count -gt 1) { throw 'Unexpected duplicate releases.' }
          $refs = gh api "repos/$repo/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify version tag.' }
          $existingRef = @($refs | Where-Object ref -eq "refs/tags/$tag")
          if ($existingRef.Count -gt 0 -and ($existingRef[0].object.type -ne 'commit' -or $existingRef[0].object.sha -ne $commit)) { throw 'Version tag points to a different commit.' }
          if ($existing.Count -eq 0) {
            gh release create $tag $archive --repo $repo --target $commit --title 'PagePath v3.0.0' --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          } else {
            $release = $existing[0]
            if ($release.draft -and $release.target_commitish -ne $commit) { throw 'Draft targets a different commit.' }
            if (-not $release.draft -and $existingRef.Count -ne 1) { throw 'Published release tag is missing.' }
            if (-not @($release.assets | Where-Object name -eq 'PagePath-v3.0.0.zip').Count) {
              gh release upload $tag $archive --repo $repo
              if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed.' }
            }
            gh release edit $tag --repo $repo --draft=false --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          }
          gh release view $tag --repo $repo --json url,tagName,isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
